<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTST Scanner — TradeAlgo Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // 1. Set theme on load
    (function() {
      const saved = localStorage.getItem('ta_theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      if (document.body) document.body.setAttribute('data-theme', saved);
    })();

    // 2. Listen for real-time theme changes
    window.addEventListener('storage', (e) => {
      if (e.key === 'ta_theme') {
        document.documentElement.setAttribute('data-theme', e.newValue);
        document.body.setAttribute('data-theme', e.newValue);
      }
    });
  </script>

  <style>
    /* EXACT MATCH FROM YOUR styles.css */
    :root {
      --bg-main: #f4f6fc;
      --bg-card: #ffffff;
      --border: rgba(0, 0, 0, 0.06);
      --text-main: #0b1a33;
      --text-muted: #7e8fa3;
      --brand: #6C5CE7;
      --success: #00b894;
      --danger: #e17055;
      --warning: #f39c12;
      --hover-bg: rgba(108,92,231,0.04);
    }

    /* DARK THEME: NAVY BLUE (Exact match from your styles.css) */
    [data-theme="dark"] {
      --bg-main: #0b0a1a;
      --bg-card: #14122e;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #e8ebf5;
      --text-muted: #7a849e;
      --brand: #6C5CE7;
      --success: #00b894;
      --danger: #e17055;
      --warning: #f39c12;
      --hover-bg: rgba(108,92,231,0.06);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      font-size: 13px;
      transition: background-color 0.3s, color 0.3s;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      background: var(--bg-card);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    input[type="date"], input[type="number"], select {
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: inherit;
      outline: none;
      font-size: 13px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      font-size: 13px;
    }

    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: #5a4bcf; }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #009e7e; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #c95a41; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .summary {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
      min-width: 120px;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .card-val { font-size: 20px; font-weight: 700; }

    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }

    th {
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tr:hover td { background: var(--hover-bg); }

    .sym { font-weight: 700; color: var(--text-main); }
    
    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .b-yes { background: rgba(0, 184, 148, 0.15); color: var(--success); }
    .b-no { background: rgba(225, 112, 85, 0.15); color: var(--danger); }
    .b-wait { background: rgba(243, 156, 18, 0.15); color: var(--warning); }
    .b-warn { background: rgba(243, 156, 18, 0.15); color: var(--warning); }

    .pos { color: var(--success); }
    .neg { color: var(--danger); }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="controls">
    <input type="date" id="scanDate">
    <button class="btn btn-primary" id="scanBtn">🔍 Scan</button>
    
    <div style="width: 1px; height: 24px; background: var(--border); margin: 0 8px;"></div>

    <select id="tradeMode">
      <option value="PAPER">📝 Paper Trade</option>
      <option value="REAL">💸 Real Trade (Kotak)</option>
    </select>
    
    <select id="productType">
      <option value="MIS">Intraday (MIS)</option>
      <option value="CNC">Delivery (CNC)</option>
      <option value="MTF">MTF</option>
    </select>

    <input type="number" id="tradeQty" value="1" min="1" placeholder="Qty" style="width: 80px;" title="Quantity per trade">

    <button class="btn btn-success" id="startAutoBtn">🚀 Start Auto-Trade</button>
    <button class="btn btn-danger" id="stopAutoBtn" style="display: none;">🛑 Stop Auto-Trade</button>

    <span id="liveStatus" style="color:var(--success); font-size:12px; margin-left: auto; font-weight: 600;">🟢 Live Feed Connected</span>
  </div>

  <div class="summary" id="summary"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>sym</th>
          <th>LTP</th>
          <th>mother_date</th>
          <th>change_pct</th>
          <th>T+1 %</th>
          <th>breakout_rvol</th>
          <th>breakout_time</th>
          <th>is_breakout</th>
          <th>mother_high</th>
          <th>days_inside</th>
          <th>Sector Rank</th> <!-- NEW COLUMN -->
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="11" style="text-align:center; padding: 40px; color: var(--text-muted);">Select a date and click Scan.</td></tr>
      </tbody>
    </table>
  </div>

  <script src="btst.js"></script>
</body>
</html>
